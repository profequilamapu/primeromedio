<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Estadística y probabilidad | Profe Quilamapu</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4fb;color:#18253c;font:17px/1.55 system-ui,Arial}header{background:linear-gradient(110deg,#233c87,#087e91);color:white;padding:26px max(20px,calc((100vw - 1120px)/2))}h1{font-size:clamp(26px,4vw,43px);line-height:1.15;margin:8px 0}h2,h3{line-height:1.25}h2{margin:0 0 12px;color:#233c87}h3{margin:18px 0 8px}main{max-width:1120px;margin:auto;padding:18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,select{font:inherit;font-weight:700;border:1px solid #c4cce5;background:white;color:#22336c;padding:9px 13px;border-radius:11px;cursor:pointer}button:hover{border-color:#5a4cb8}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #e9ab22}button.active,.primary{background:#3549a5;color:white;border-color:#3549a5}button:disabled{opacity:.55;cursor:default}.bar{height:13px;border-radius:20px;background:#dce3ef;overflow:hidden}.bar>div{height:100%;background:#15a792;width:0;transition:width .2s}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700}.panel{background:white;border-radius:22px;padding:24px;box-shadow:0 5px 18px #243c6815;margin:12px 0}.hero{display:flex;align-items:center;justify-content:space-between;gap:15px;background:#e3f2ff;padding:20px;border-radius:17px}.big{font-size:52px}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px;margin:12px 0}article{background:#eef4ff;border:1px solid #dce5fb;border-radius:14px;padding:15px}article:nth-child(even){background:#e4f8f1;border-color:#cbe8de}article h3{margin-top:0}p{margin:8px 0 13px}.note,.formula{padding:12px 15px;border-radius:12px;margin:13px 0;background:#fff1c9;border-left:5px solid #e3a72e}.formula{background:#e2f4ff;border-color:#087e91;font-size:20px;font-weight:750}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:stretch;text-align:center;line-height:1.15;margin:0 3px}.frac span:first-child{border-bottom:1.7px solid currentColor;padding:2px 5px}.frac span:last-child{padding:2px 5px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #c7d5e7;text-align:center;padding:9px}th{background:#e7eefb}input,textarea{font:inherit;border:1px solid #8a9cbb;border-radius:8px;padding:8px}input:not([type=checkbox]){width:92px;max-width:100%}textarea{width:100%}.buttons{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:10px 0}.feedback{min-height:1.3em;font-weight:650}.correct{color:#076c47}.wrong{color:#a13b32}.q{border-top:1px solid #dce3ee;padding:15px 0}.options{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.options button{text-align:left}.options button.good{background:#d4f6e1;border-color:#23925a}.options button.bad{background:#ffebe8;border-color:#d76a56}svg{width:100%;max-width:600px;display:block;margin:10px auto;background:white}details{border:1px solid #d3d8eb;padding:12px;border-radius:10px;margin:12px 0}summary{cursor:pointer;font-weight:700;color:#3549a5}.slots{display:flex;gap:8px;flex-wrap:wrap}.slot{display:grid;place-items:center;width:60px;height:60px;background:#e9e6ff;border:2px solid #9c8bda;border-radius:10px;font-size:25px;font-weight:bold}.footer{display:flex;justify-content:space-between;gap:12px;margin:16px 0}.tiny{font-size:14px;color:#536278}.pill{display:inline-block;background:#ffffff26;border-radius:30px;padding:4px 12px;font-weight:700;font-size:14px}@media(max-width:650px){.panel{padding:14px}main{padding:10px}td,th{padding:5px}input:not([type=checkbox]){width:66px}.big{font-size:30px}}
</style><body><header><span class="pill">PROFE QUILAMAPU · MATEMÁTICA · 1° MEDIO</span><h1>Misión: datos y azar</h1><p>Repaso interactivo · 60 minutos · Estadística, probabilidad y conteo</p></header><main><div class="top"><span id="stageInfo"></span><span id="score"></span></div><div class="bar"><div id="progress"></div></div><nav id="nav" aria-label="Etapas"></nav><div id="content"></div><div class="footer"><button id="prev" onclick="go(current-1)">← Anterior</button><button class="primary" id="next" onclick="go(current+1)">Siguiente →</button></div><p class="tiny">Profe Quilamapu · Repaso guiado. Los desafíos desplegables permiten profundizar si queda tiempo.</p></main><script>const stages=[{"title": "Activación", "time": 5, "tag": "INICIO", "body": "<div class=\"hero\"><div><h2>¿Qué nos cuentan los datos y el azar?</h2><p>Hoy aprenderemos a interpretar información y resolver situaciones de probabilidad sin confundir las operaciones.</p></div><div class=\"big\">📊 + 🎲</div></div><div class=\"cols\"><article><h3>Estadística</h3><p>Observa, organiza e interpreta datos de una población o muestra.</p></article><article><h3>Probabilidad</h3><p>Identifica los resultados posibles y calcula qué tan probable es un suceso.</p></article></div><div class=\"note\"><b>Meta:</b> al finalizar podrás escoger una estrategia, mostrar tus cálculos y explicar el resultado. Ten papel y lápiz a mano.</div>", "qs": [{"text": "Se encuesta a 40 de los 320 estudiantes de un colegio. ¿Cuál es la muestra?", "opts": ["320 estudiantes", "40 estudiantes", "Todos los colegios"], "a": 1, "why": "La muestra es la parte que se estudia. La población son los 320 estudiantes."}, {"text": "¿Cuál es un experimento aleatorio?", "opts": ["Calcular 8 + 2", "Lanzar un dado", "Contar las caras de un cubo"], "a": 1, "why": "No se sabe con certeza cuál cara saldrá."}]}, {"title": "Datos y frecuencias", "time": 8, "tag": "DESARROLLO", "body": "<div class=\"cols\"><article><h3>Población y muestra</h3><p><b>TO–PA:</b> TOdos = población, PArte = muestra.</p><p>Variable cualitativa: categoría.<br>Discreta: se cuenta.<br>Continua: se mide.</p></article><article><h3>Frecuencia</h3><p>fi = cantidad de veces.</p><div class=\"formula\">hi = <span class=\"frac\"><span>fi</span><span>N</span></span> &nbsp; | &nbsp; % = hi × 100</div><p>Las fi suman N; las hi suman 1 y los porcentajes, 100%.</p></article></div><h3>Ejemplo guiado · 20 estudiantes</h3><table><tr><th>Transporte</th><th>fi</th><th>hi</th><th>%</th></tr><tr><td>Micro</td><td>8</td><td>0,40</td><td>40%</td></tr><tr><td>Auto</td><td>5</td><td>0,25</td><td>25%</td></tr><tr><td>A pie</td><td>4</td><td><input data-ans=\"0.2\" placeholder=\"hi\" aria-label=\"Frecuencia relativa a pie\"></td><td><input data-ans=\"20\" placeholder=\"%\" aria-label=\"Porcentaje a pie\"></td></tr><tr><td>Bicicleta</td><td>3</td><td><input data-ans=\"0.15\" placeholder=\"hi\" aria-label=\"Frecuencia relativa bicicleta\"></td><td><input data-ans=\"15\" placeholder=\"%\" aria-label=\"Porcentaje bicicleta\"></td></tr><tr><th>Total</th><th>20</th><th>1</th><th>100%</th></tr></table><button onclick=\"checkInputs(this)\">Comprobar tabla</button><p class=\"feedback\" aria-live=\"polite\"></p><div class=\"note\">Ejemplo: micro → <span class=\"frac\"><span>8</span><span>20</span></span> = 0,40 → 40%. Divide por el total, no por otra categoría.</div>", "qs": [{"text": "¿Qué tipo de variable es la estatura?", "opts": ["Cualitativa", "Cuantitativa discreta", "Cuantitativa continua"], "a": 2, "why": "La estatura se mide y admite decimales."}, {"text": "Si 9 de 30 estudiantes prefieren fútbol, ¿qué porcentaje representan?", "opts": ["9%", "30%", "70%"], "a": 1, "why": "9 ÷ 30 = 0,3; multiplica por 100."}]}, {"title": "Tablas y dispersión", "time": 7, "tag": "DESARROLLO", "body": "<h3>Dos variables de cada persona = datos bivariados</h3><p>La frecuencia conjunta está en el cruce de fila y columna; la marginal, en los totales.</p><table><tr><th>Curso</th><th>Fútbol</th><th>Vóleibol</th><th>Total</th></tr><tr><td>1°A</td><td>6</td><td>4</td><td><input data-ans=\"10\" aria-label=\"Total 1A\"></td></tr><tr><td>1°B</td><td>3</td><td>7</td><td><input data-ans=\"10\" aria-label=\"Total 1B\"></td></tr><tr><th>Total</th><td><input data-ans=\"9\" aria-label=\"Total fútbol\"></td><td><input data-ans=\"11\" aria-label=\"Total vóleibol\"></td><td><input data-ans=\"20\" aria-label=\"Total general\"></td></tr></table><button onclick=\"checkInputs(this)\">Revisar totales</button><p class=\"feedback\" aria-live=\"polite\"></p><h3>Explora la nube de puntos</h3><p>X horizontal: variable explicativa; Y vertical: variable respuesta. Pulsa cada tipo y observa cómo se distribuyen los puntos.</p><div class=\"buttons\"><button onclick=\"plot('pos')\">↗ Positiva</button><button onclick=\"plot('neg')\">↘ Negativa</button><button onclick=\"plot('none')\">Nula</button><button onclick=\"plot('out')\">Atípico</button></div><svg id=\"plot\" viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Nube de puntos con ejes numerados\"></svg><p id=\"plotInfo\" class=\"note\"></p><p>Para comparar poblaciones, distingue los grupos, usa la misma escala y no inventes datos ausentes. Correlación no implica causalidad.</p>", "qs": [{"text": "El 7 en 1°B y vóleibol es una frecuencia…", "opts": ["Marginal", "Conjunta", "Relativa"], "a": 1, "why": "Es el cruce de dos categorías."}, {"text": "Si X aumenta y Y tiende a disminuir, la correlación es…", "opts": ["Positiva", "Negativa", "Nula"], "a": 1, "why": "La tendencia baja de izquierda a derecha."}]}, {"title": "Azar y Laplace", "time": 8, "tag": "DESARROLLO", "body": "<div class=\"cols\"><article><h3>Espacio muestral Ω</h3><p>Todos los resultados posibles: dado = {1, 2, 3, 4, 5, 6}.</p><p>Suceso A: obtener un número par = {2, 4, 6}.</p><p>Dos monedas: CC, CS, SC, SS (C = cara; S = sello).</p></article><article><h3>Regla de Laplace</h3><p>Si los resultados son equiprobables:</p><div class=\"formula\">P(A) = <span class=\"frac\"><span>favorables</span><span>posibles</span></span></div><p>Par en dado: <span class=\"frac\"><span>3</span><span>6</span></span> = <span class=\"frac\"><span>1</span><span>2</span></span> = 50%.</p><p>Imposible: 0. Seguro: 1.</p></article></div><h3>Laboratorio · dado o dos monedas</h3><p>Compara la frecuencia observada con el valor teórico (pares: 50%; al menos una cara: 75%).</p><div class=\"buttons\"><select id=\"simType\" onchange=\"resetSim()\" aria-label=\"Experimento\"><option value=\"dice\">Dado: obtener par</option><option value=\"coin\">Dos monedas: al menos una cara</option></select><button onclick=\"sim(1)\">1 ensayo</button><button onclick=\"sim(100)\">100 ensayos</button><button onclick=\"resetSim()\">Reiniciar</button></div><div id=\"simOut\" class=\"note\" aria-live=\"polite\">Sin ensayos todavía.</div><div class=\"bar\"><div id=\"simBar\"></div></div><p>Con muchos ensayos, la frecuencia relativa suele acercarse a la probabilidad teórica, sin que deba coincidir exactamente.</p>", "qs": [{"text": "En dos monedas equilibradas, ¿cuál es P(exactamente una cara)?", "opts": ["1/4", "1/2", "3/4"], "a": 1, "why": "CS y SC: dos resultados de cuatro."}, {"text": "¿Cuál es P(obtener un número mayor que 4 en un dado común equilibrado)?", "opts": ["1/6", "2/6", "4/6"], "a": 1, "why": "Los casos favorables son 5 y 6."}]}, {"title": "Conjuntos y complemento", "time": 8, "tag": "DESARROLLO", "body": "<h3>Unión = A o B (incluye ambos) · Intersección = A y B</h3><div class=\"formula\">n(A ∪ B) = n(A) + n(B) − n(A ∩ B)</div><p>En 30 estudiantes: 16 practican A, 12 practican B y 5 ambos.</p><svg viewBox=\"0 0 460 230\" role=\"img\" aria-label=\"Venn de dos conjuntos\"><rect x=\"5\" y=\"5\" width=\"450\" height=\"220\" rx=\"12\" fill=\"white\" stroke=\"#789\"/><circle cx=\"185\" cy=\"112\" r=\"85\" fill=\"#6ed8e5\" fill-opacity=\".75\" stroke=\"#067b91\"/><circle cx=\"275\" cy=\"112\" r=\"85\" fill=\"#ffbd72\" fill-opacity=\".7\" stroke=\"#b77409\"/><g text-anchor=\"middle\" font-size=\"21\" font-weight=\"bold\"><text x=\"145\" y=\"120\">11</text><text x=\"230\" y=\"120\">5</text><text x=\"315\" y=\"120\">7</text><text x=\"410\" y=\"205\">7</text><text x=\"130\" y=\"32\">A</text><text x=\"330\" y=\"32\">B</text></g></svg><p>Unión = 11 + 5 + 7 = 23. Ninguno = 30 − 23 = 7.</p><div class=\"formula\">P(no A) = 1 − P(A)</div><details><summary>Desafío guiado · Venn de tres conjuntos</summary><p>40 estudiantes: A=20, B=18, C=15; AB=7, AC=6, BC=5; ABC=2. Las parejas incluyen el centro.</p><svg viewBox=\"0 0 480 320\" role=\"img\" aria-label=\"Venn de tres conjuntos\"><circle cx=\"185\" cy=\"125\" r=\"100\" fill=\"#7bd9ed\" fill-opacity=\".6\" stroke=\"#087b90\"/><circle cx=\"295\" cy=\"125\" r=\"100\" fill=\"#ffc18e\" fill-opacity=\".6\" stroke=\"#b87509\"/><circle cx=\"240\" cy=\"215\" r=\"100\" fill=\"#b7a8f8\" fill-opacity=\".6\" stroke=\"#6946b9\"/><g text-anchor=\"middle\" font-size=\"19\" font-weight=\"bold\"><text x=\"132\" y=\"110\">9</text><text x=\"348\" y=\"110\">8</text><text x=\"240\" y=\"80\">5</text><text x=\"184\" y=\"198\">4</text><text x=\"296\" y=\"198\">3</text><text x=\"240\" y=\"156\">2</text><text x=\"240\" y=\"270\">6</text><text x=\"28\" y=\"300\">3</text></g></svg><p>1. Centro: 2. 2. Parejas exclusivas: 7−2=5; 6−2=4; 5−2=3. 3. Solo A: 20−5−4−2=9; solo B=8; solo C=6. 4. Unión=37; ninguno=3.</p></details>", "qs": [{"text": "Si 18 prefieren A, 15 B y 6 ambos, ¿cuántos prefieren al menos uno?", "opts": ["33", "27", "21"], "a": 1, "why": "18 + 15 − 6 = 27. No cuentes dos veces la intersección."}, {"text": "Si P(A)=0,35, ¿cuánto vale P(no A)?", "opts": ["0,35", "0,65", "1,35"], "a": 1, "why": "1 − 0,35 = 0,65."}]}, {"title": "Probabilidad compuesta", "time": 9, "tag": "DESARROLLO", "body": "<div class=\"cols\"><article><h3>Independencia</h3><p>Un resultado no modifica la probabilidad del otro.</p><div class=\"formula\">P(A ∩ B) = P(A) × P(B)</div><p>Cara y 6: <span class=\"frac\"><span>1</span><span>2</span></span> × <span class=\"frac\"><span>1</span><span>6</span></span> = <span class=\"frac\"><span>1</span><span>12</span></span></p></article><article><h3>Con / sin reposición</h3><p>Con: se devuelve el objeto; la composición no cambia.</p><p>Sin: se retira; cambia la probabilidad de la segunda extracción.</p></article></div><h3>Árbol interactivo · 3 verdes y 2 amarillas</h3><div class=\"buttons\"><button onclick=\"tree(false)\">Sin reposición</button><button onclick=\"tree(true)\">Con reposición</button></div><svg id=\"tree\" viewBox=\"0 0 600 265\" role=\"img\" aria-label=\"Árbol de probabilidades\"></svg><p id=\"treeInfo\" class=\"note\"></p><p><b>Regla:</b> multiplica dentro de cada ruta y suma las rutas favorables. Para al menos un éxito, calcula el complemento (ningún éxito).</p><details><summary>Ejemplo con complemento y método de Pólya</summary><p>1. Comprender: dos lanzamientos independientes de moneda; al menos una cara.</p><p>2. Planificar: usar el complemento, cero caras (SS).</p><p>3. Ejecutar: 1 − (<span class=\"frac\"><span>1</span><span>2</span></span> × <span class=\"frac\"><span>1</span><span>2</span></span>) = <span class=\"frac\"><span>3</span><span>4</span></span> = 75%.</p><p>4. Comprobar: el resultado está entre 0 y 1 y hay tres resultados favorables.</p></details>", "qs": [{"text": "Hay 4 rojas y 2 azules. Si se extrae una roja sin devolverla, ¿cuál es P(otra roja)?", "opts": ["4/6", "3/5", "4/5"], "a": 1, "why": "Quedan 3 rojas de 5 fichas."}, {"text": "Si P(éxito)=0,2 en dos intentos independientes, ¿P(al menos un éxito)?", "opts": ["0,04", "0,36", "0,80"], "a": 1, "why": "1 − 0,8 × 0,8 = 0,36."}]}, {"title": "Principios de conteo", "time": 7, "tag": "DESARROLLO", "body": "<div class=\"cols\"><article><h3>Multiplicativo · Y</h3><p>3 panes y 2 rellenos → 3 × 2 = 6 combinaciones.</p></article><article><h3>Aditivo · O excluyente</h3><p>6 combinaciones de sándwich O 4 snacks → 6 + 4 = 10 opciones.</p></article></div><h3>Constructor de claves</h3><p>El orden importa. Cambia los valores y comprueba cómo varía la cantidad de claves.</p><div class=\"buttons\"><label>Símbolos disponibles <input id=\"symbols\" type=\"number\" min=\"1\" max=\"10\" value=\"5\" oninput=\"count()\"></label><label>Posiciones <input id=\"places\" type=\"number\" min=\"1\" max=\"6\" value=\"3\" oninput=\"count()\"></label><label><input id=\"repeat\" type=\"checkbox\" checked onchange=\"count()\"> Permitir repetición</label></div><div id=\"slots\" class=\"slots\"></div><div id=\"countOut\" class=\"note\" aria-live=\"polite\"></div><details><summary>Ejemplo de patente con restricción</summary><p>2 letras (solo 5 vocales) y 4 dígitos (10 opciones), con repetición: 5² × 10⁴ = 250.000 patentes. Si la repetición no está permitida, las opciones disminuyen en cada posición del mismo tipo.</p></details><div class=\"note\">Pólya: comprender → planificar → ejecutar → comprobar. Elige la operación según la situación, no solo por una palabra clave.</div>", "qs": [{"text": "Hay 4 camisetas, 3 pantalones y 2 pares de zapatos. ¿Cuántos conjuntos completos?", "opts": ["9", "24", "12"], "a": 1, "why": "4 × 3 × 2 = 24."}, {"text": "Clave de 3 letras distintas elegidas de 6 letras. ¿Cuántas claves?", "opts": ["216", "120", "18"], "a": 1, "why": "6 × 5 × 4 = 120 porque no se repiten."}]}, {"title": "Ticket de salida", "time": 8, "tag": "CIERRE", "body": "<h3>Desafío final · responde sin mirar las explicaciones</h3><p>Resuelve las preguntas y revisa la retroalimentación. Anota en tu cuaderno qué contenido necesitas volver a estudiar.</p><div class=\"note\"><b>Metacognición:</b> ¿qué estrategia me resultó más fácil? ¿En qué momento confundí sumar con multiplicar? ¿Cómo puedo comprobar mi respuesta?</div><label for=\"reflection\">Mi compromiso para la próxima clase:</label><textarea id=\"reflection\" rows=\"3\" placeholder=\"Necesito practicar…\"></textarea>", "qs": [{"text": "De 40 personas, 10 prefieren bicicleta. ¿hi?", "opts": ["0,25", "0,4", "0,10"], "a": 0, "why": "10 ÷ 40 = 0,25."}, {"text": "Una nube sin tendencia clara indica correlación…", "opts": ["Positiva", "Negativa", "Nula"], "a": 2, "why": "No se distingue una relación lineal clara."}, {"text": "Si A=14, B=10 y ambos=4, ¿unión?", "opts": ["20", "24", "18"], "a": 0, "why": "14 + 10 − 4 = 20."}, {"text": "Dos dados independientes: P(dos seis) es…", "opts": ["1/6", "1/12", "1/36"], "a": 2, "why": "1/6 × 1/6 = 1/36."}, {"text": "Bolsa: 3 rojas, 1 azul. P(dos rojas sin reposición) es…", "opts": ["1/2", "9/16", "3/4"], "a": 0, "why": "3/4 × 2/3 = 1/2."}, {"text": "Clave de 2 dígitos del 0 al 9 con repetición, incluido cero inicial. ¿Cuántas?", "opts": ["90", "100", "20"], "a": 1, "why": "10 × 10 = 100."}]}];
let current=0,answers={},saved={},trials=0,hits=0;const el=id=>document.getElementById(id);function save(){let e=el('content');if(e.firstChild)saved[current]=[...e.querySelectorAll('input,textarea,select')].map(x=>x.type==='checkbox'?x.checked:x.value)}function go(i){if(i<0||i>=stages.length)return;save();current=i;render();window.scrollTo({top:0,behavior:'smooth'})}function status(){let total=stages.reduce((a,s)=>a+s.qs.length,0),correct=Object.values(answers).filter(x=>x.ok).length;el('score').textContent=`Práctica: ${correct}/${total} correctas`;if(current===7){let n=stages[7].qs.filter((q,j)=>answers['7-'+j]?.ok).length;el('ticket').textContent=`Ticket de salida: ${n}/6 correctas. ${n===6?'¡Excelente!':n>=4?'Buen avance; repasa los errores.':'Completa las preguntas y revisa las explicaciones.'}`}}function render(){let s=stages[current],start=stages.slice(0,current).reduce((a,b)=>a+b.time,0);el('stageInfo').textContent=`${s.tag} · Minutos ${start}–${start+s.time} · Etapa ${current+1}/8`;el('progress').style.width=(start+s.time)/60*100+'%';el('nav').innerHTML=stages.map((v,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})">${i+1}. ${v.title} · ${v.time} min</button>`).join('');el('content').innerHTML=`<section class="panel"><h2>${s.title}</h2>${s.body}</section><section class="panel"><h2>${current===7?'Quiz final':'Comprueba lo aprendido'}</h2>${s.qs.map((q,j)=>`<div class="q"><b>${j+1}. ${q.text}</b><div class="options">${q.opts.map((o,k)=>`<button id="b${j}-${k}" onclick="answer(${j},${k})">${String.fromCharCode(65+k)}. ${format(o)}</button>`).join('')}</div><div class="feedback" id="f${j}" aria-live="polite"></div></div>`).join('')}${current===7?'<div class="note" id="ticket"></div><button onclick="resetTicket()">Reintentar quiz</button>':''}</section>`;if(saved[current])el('content').querySelectorAll('input,textarea,select').forEach((x,i)=>{if(saved[current][i]!==undefined){if(x.type==='checkbox')x.checked=saved[current][i];else x.value=saved[current][i]}});s.qs.forEach((q,j)=>{let a=answers[current+'-'+j];if(a)showAnswer(j,a.choice)});if(current===2)plot('pos');if(current===3)resetSim();if(current===5)tree(false);if(current===6)count();el('prev').disabled=current===0;el('next').disabled=current===7;status()}function format(s){return s.replace(/\b(\d+)\/(\d+)\b/g,'<span class="frac"><span>$1</span><span>$2</span></span>')}function answer(j,k){let q=stages[current].qs[j];answers[current+'-'+j]={choice:k,ok:k===q.a};showAnswer(j,k);status()}function showAnswer(j,k){let q=stages[current].qs[j],ok=k===q.a; q.opts.forEach((o,i)=>el('b'+j+'-'+i).className=i===k?(ok?'good':'bad'):'');let f=el('f'+j);f.className='feedback '+(ok?'correct':'wrong');f.textContent=(ok?'✓ Correcto. ':'Intenta de nuevo. ')+q.why}function resetTicket(){Object.keys(answers).filter(x=>x.startsWith('7-')).forEach(x=>delete answers[x]);save();render()}function checkInputs(b){let a=[...b.parentElement.querySelectorAll('[data-ans]')],n=0;a.forEach(x=>{let good=x.value.trim()!==''&&Math.abs(Number(x.value.replace(',','.'))-Number(x.dataset.ans))<1e-8;if(good)n++;x.style.borderColor=good?'#16844d':'#bd5147'});let f=b.nextElementSibling;f.className='feedback '+(n===a.length?'correct':'wrong');f.textContent=n===a.length?'✓ Todos correctos.':`${n}/${a.length} correctos. Revisa los campos marcados y vuelve a intentar.`}function plot(k){let sets={pos:[[1,1],[2,2],[3,2.7],[4,4],[5,4.7],[6,5.8]],neg:[[1,5.8],[2,4.9],[3,4.1],[4,3],[5,2.1],[6,1]],none:[[1,4],[2,1],[3,5],[4,2],[5,4],[6,3]],out:[[1,1],[2,2],[3,2.7],[4,4],[5,.5],[6,5.8]]};let s='';for(let i=0;i<=6;i++){let x=55+i*66,y=245-i*34;s+=`<path d="M${x} 41 V245 M55 ${y} H451" stroke="#d9e3ee"/><text x="${x}" y="264" text-anchor="middle" font-size="13">${i}</text><text x="43" y="${y+4}" text-anchor="end" font-size="13">${i}</text>`}s+='<path d="M55 35 V245 H466" stroke="#213653" stroke-width="2" fill="none"/><text x="245" y="290" text-anchor="middle">Variable X</text><text x="15" y="145" transform="rotate(-90 15 145)" text-anchor="middle">Variable Y</text>';sets[k].forEach(([x,y],i)=>s+=`<circle cx="${55+x*66}" cy="${245-y*34}" r="7" fill="${k==='out'&&i===4?'#c55230':'#087e91'}" stroke="#193951"/>`);el('plot').innerHTML=s;el('plotInfo').textContent={pos:'Positiva: X aumenta y Y tiende a aumentar.',neg:'Negativa: X aumenta y Y tiende a disminuir.',none:'Nula: no se aprecia una tendencia lineal clara.',out:'Dato atípico: el punto destacado se aparta de la tendencia; revisa antes de excluirlo.'}[k]}function resetSim(){trials=hits=0;el('simBar').style.width='0%';el('simOut').textContent='Sin ensayos todavía.'}function sim(n){let last='';for(let i=0;i<n;i++){if(el('simType').value==='dice'){let d=1+Math.floor(Math.random()*6);last=d;hits+=d%2===0?1:0}else{last=(Math.random()<.5?'C':'S')+(Math.random()<.5?'C':'S');hits+=last.includes('C')?1:0}trials++}let p=100*hits/trials;el('simOut').textContent=`Último: ${last} · Favorables: ${hits}/${trials} · Frecuencia: ${p.toFixed(1)}%`;el('simBar').style.width=p+'%'}function tree(rep){let a=rep?[3,2,3,2]:[2,2,3,1],d=rep?5:4;let s='<g fill="none" stroke="#647a9b" stroke-width="3"><path d="M70 130 L215 65 M70 130 L215 195 M215 65 L405 25 M215 65 L405 100 M215 195 L405 160 M215 195 L405 235"/></g><g font-size="16" font-weight="bold"><text x="8" y="130">Inicio</text><text x="125" y="77">V 3/5</text><text x="125" y="195">A 2/5</text>';['VV','VA','AV','AA'].forEach((r,i)=>{let y=[25,100,160,235][i],num=(i<2?3:2)*a[i];s+=`<text x="270" y="${y-6}">${r[1]} ${a[i]}/${d}</text><text x="420" y="${y}" fill="${i===0||i===3?'#076c47':'#243954'}">${r} = ${num}/${5*d}${i===0||i===3?' ✓':''}</text>`});el('tree').innerHTML=s+'</g>';el('treeInfo').textContent=rep?'Mismo color: 9/25 + 4/25 = 13/25 = 52%.':'Mismo color: 6/20 + 2/20 = 8/20 = 40%.'}function count(){let n=Number(el('symbols').value),p=Number(el('places').value),r=el('repeat').checked;if(!Number.isInteger(n)||!Number.isInteger(p)||n<1||n>10||p<1||p>6){el('countOut').textContent='Usa 1–10 símbolos y 1–6 posiciones.';el('slots').innerHTML='';return}let a=Array.from({length:p},(_,i)=>r?n:Math.max(0,n-i));el('slots').innerHTML=a.map(x=>`<div class="slot">${x}</div>`).join('');el('countOut').textContent=a.join(' × ')+' = '+a.reduce((x,y)=>x*y,1).toLocaleString('es-CL')+' claves posibles.'}render();</script></body></html>
